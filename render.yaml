services:
  - type: web
    name: sis-calif
    env: php
    plan: free
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php -S 0.0.0.0:10000 -t public
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sis-calif-db
          property: connectionString
databases:
  - name: sis-calif-db
    plan: free
    databaseName: sis_calif
    user: sis_calif_user
